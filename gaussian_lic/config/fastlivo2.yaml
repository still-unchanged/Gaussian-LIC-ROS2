width: 640
height: 512
fx: 646.78472
fy: 646.65775
cx: 313.456795
cy: 261.399612

select_every_k_frame: 5
# `adaptive` uses sparse-depth reprojection, image quality and view overlap.
# The parallax is normalized by the image diagonal, making this portable across
# camera resolutions. Set this back to `fixed` to reproduce interval sampling.
keyframe_mode: adaptive
# Target information density: normally wait until the median reprojection
# displacement reaches 10% of the image diagonal. This describes useful view
# change rather than a dataset-specific distance or frame count. The emergency
# threshold protects against a major local change before the median catches up.
# The maximum interval is only a coverage safeguard.
keyframe_min_frame_gap: 2
keyframe_min_interval_s: 0.30
keyframe_max_interval_s: 0.80
keyframe_target_normalized_parallax: 0.10
keyframe_emergency_normalized_parallax: 0.20
# Deprecated compatibility alias for pre-density configurations.
keyframe_min_normalized_parallax: 0.10
keyframe_min_overlap: 0.70
# Reject poor candidate frames when another good frame can arrive before the
# maximum interval. Exposure score is the usable-luminance fraction; sharpness
# is measured relative to the preceding accepted keyframe.
keyframe_min_exposure_score: 0.60
keyframe_min_sharpness_ratio: 0.50
# Reprojection is trusted only when the current sparse depth covers at least
# this fraction of the image. A 5% relative depth tolerance handles normal
# LiDAR sampling and pose noise without treating occluded points as overlap.
keyframe_min_depth_coverage: 0.002
keyframe_depth_consistency_rel: 0.05
depth_completion: true
# Set true only for a mesh run.  It writes per-keyframe RGB, completed metric
# depth and world-to-camera poses under <result_path>_tsdf_input.
tsdf_export: false
patch_size: 10
max_depth: 20

sh_degree: 3
white_background: false  # no adjustment needed
random_background: false  # no adjustment needed
convert_SHs_python: false  # no adjustment needed
compute_cov3D_python: false  # no adjustment needed
lambda_erank: 0  # no adjustment needed
scaling_scale: 1  # the larger value tends to yield less Gaussians

position_lr: 0.00016
feature_lr: 0.0050  # the larger value tends to yield better performance
opacity_lr: 0.05
scaling_lr: 0.005  # the larger value tends to yield less Gaussians
rotation_lr: 0.001
lambda_dssim: 0.2
optimize_depth: true
lambda_depth: 0.005
iteration_decay: false

apply_exposure: false
exposure_lr: 0.001
skybox_points_num: 0  # 100000
skybox_radius: 1000
