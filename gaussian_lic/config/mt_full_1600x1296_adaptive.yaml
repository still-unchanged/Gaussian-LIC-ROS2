# MT20260910-140005 camera-1, preserving the source 1600x1296 pixels.
# Sparse rendered depth is used directly: no resolution-specific TensorRT
# completion engine is loaded.
width: 1600
height: 1296
fx: 800.0000000000001
fy: 800.0000000000001
cx: 800.0
cy: 648.0

select_every_k_frame: 5
keyframe_mode: adaptive
keyframe_min_frame_gap: 2
keyframe_min_interval_s: 0.30
keyframe_max_interval_s: 0.80
keyframe_target_normalized_parallax: 0.10
keyframe_emergency_normalized_parallax: 0.20
keyframe_min_normalized_parallax: 0.10
keyframe_min_overlap: 0.70
keyframe_min_exposure_score: 0.60
keyframe_min_sharpness_ratio: 0.50
keyframe_min_depth_coverage: 0.002
keyframe_depth_consistency_rel: 0.05

depth_completion: false
patch_size: 10
max_depth: 50.0
sh_degree: 3
white_background: false
random_background: false
convert_SHs_python: false
compute_cov3D_python: false
lambda_erank: 0
scaling_scale: 1
position_lr: 0.00016
feature_lr: 0.005
opacity_lr: 0.05
scaling_lr: 0.005
rotation_lr: 0.001
lambda_dssim: 0.2
optimize_depth: true
lambda_depth: 0.005
iteration_decay: false
apply_exposure: false
exposure_lr: 0.001
skybox_points_num: 0
skybox_radius: 1000
