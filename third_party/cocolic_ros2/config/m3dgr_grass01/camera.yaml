%YAML:1.0

# The bag stores this as /camera/color/image_raw/compressed.  Coco-LIC derives
# the compressed suffix automatically and decodes it internally.
image_topic: /camera/color/image_raw
image_width: 640
image_height: 480
cam_fx: 607.79772949218
cam_fy: 607.83526613281
cam_cx: 328.79772949218
cam_cy: 245.53321838378
cam_d0: 0.0
cam_d1: 0.0
cam_d2: 0.0
cam_d3: 0.0
cam_d4: 0.0

# Camera -> IMU.  Keep the official M3DGR Coco-LIC baseline convention: its
# IMU reference is the Avia body frame, so do NOT compose the Avia built-in
# IMU translation or transpose this rotation matrix.
CameraExtrinsics:
    time_offset: 0.0
    Trans: [-0.16154852509498596, 0.0119510218501091, 0.09044823050498962]
    Rot: [ 0.0210767, -0.0038717,  0.9997703,
          -0.9993969,  0.0275209,  0.0211754,
          -0.0275965, -0.9996137, -0.0032894]

img_time_offset: 0.0
